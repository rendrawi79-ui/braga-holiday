<!DOCTYPE html>
<html>

<head>
  <title>DATABASE DRIVER</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    /*  */
    body {
      background-color: #00000;
      font-family: Trebuchet MS;
      background-image: url('1.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      height: 100vh;
      margin: 0; 
    }
    #form-container {
      width: 500px;
      margin: 0 auto;
      background-color: #f1f1f7;
      border: 2px solid #da7808;
      border-radius: 10px;
      padding: 20px;
    }
    #form-container h2 {
      text-align: center;
      color: #1E90FF;
    }
    #form-container input[type="text"], #form-container select[type="pilihan"], #form-container input[type="date"], #form-container input[type="tel"] , #form-container input[type="number"],#form-container input[type="time"] {
      width: 100%;
      padding: 10px;
      margin-bottom: 20px;
      border: 2px solid #f1d0d0;
      border-radius: 5px;
    }
     #form-container select[type="pilihan"] {
      width: 100%;
      padding: 10px;
      margin-bottom: 20px;
      border: 2px solid #f1d0d0;
      border-radius: 5px;
     }
    #form-container input[type="submit"] {
      background-color: #1E90FF;
      color: #FFFFFF;
      border: none;
      border-radius: 5px;
      padding: 10px;
      cursor: pointer;
    }
    #form-container input[type="submit"]:hover {
      background-color: #004B8D;
    }
    #form-container button[type="edit"] { 
      background-color: #1E90FF;
      color: #FFFFFF;
      border: none;
      border-radius: 5px;
      padding: 10px;
      cursor: pointer;
    }
   #form-container button[type="edit"]:hover {
      background-color: #004B8D;
    }
     #form-container button[type="search"] { 
      background-color: #1E90FF;
      color: #FFFFFF;
      border: none;
      border-radius: 5px;
      padding: 10px;
      cursor: pointer;
    }
   #form-container button[type="search"]:hover {
      background-color: #004B8D;
   }
    #footer {
      text-align: center;
      margin-top: 30px;
      font-size: 20px;
      color: #f7f1f1;
    }
  </style>
</head>

<body>
  <div id="form-container">
    <h2>DATABASE DRIVER</h2>
    <!-- akses link script app -->
    <form action="https://script.google.com/macros/s/AKfycbyCN_hnWe8mL8ryd51FXi9yy1Ufm2wi__5letFk89aWnIwTURvf17P_JzL7PBogadI/exec" method="post">
    <!-- end akses  -->

      <label for="id_driver">ID DRIVER  :</label>
      <input type="text" id="id_driver" name="id_driver" required>
      <label for="nama_lengkap">NAMA LENGKAP  :</label>
      <input type="text" id="nama_lengkap" name="nama_lengkap" required>
      <label for="tempat_tgl_lahir">TEMPAT / TANGGAL LAHIR  :</label>
      <input type="text" id="tempat_tgl_lahir" name="tempat_tgl_lahir" required>
      <label for="jenis_kelamin">JENIS KELAMIN:</label>
      <select type="pilihan" id="jenis_kelamin" name="jenis_kelamin" required>
      <option value="" disabled selected>--Pilih--</option>
      <option value="PRIA">PRIA</option>
      <option value="WANITA">WANITA</option>
      </select>
      <label for="agama">AGAMA  :</label>
      <select type="pilihan" id="agama" name="agama" required>
      <option value="" disabled selected>--Pilih--</option>
      <option value="ISLAM">ISLAM</option>
      <option value="KRISTEN">KRISTEN</option>
      <option value="HINDU">HINDU</option>
      <option value="BUDHA">BUDHA</option>
      <option value="LAINNYA">LAINNYA</option>
      </select>
      <label for="no_hp_1">NOMOR HANDPHONE 1  :</label>
      <input type="tel" id="no_hp1" name="no_hp_1" pattern="[0-9]{10,12}" required>
      <label for="no_hp_2">NOMOR HANDPHONE 2  :</label>
      <input type="tel" id="no_hp_2" name="no_hp_2" pattern="[0-9]{10,12}" required>
      <label for="email">EMAIL  :</label>
      <input type="text" id="email" name="email" required>
      <label for="alamat_lengkap">ALAMAT LENGKAP  :</label>
      <input type="text" id="alamat_lengkap" name="alamat_lengkap" required>
      <label for="status_perkawinan">STATUS PERKAWINAN  :</label>
      <select type="pilihan" id="status_perkawinan" name="status_perkawinan" required>
      <option value="" disabled selected>--Pilih--</option>
      <option value="MENIKAH">MENIKAH</option>
      <option value="BELUM MENIKAH">BELUM MENIKAH</option>
      <option value="PERNAH MENIKAH">PERNAH MENIKAH</option>
      </select>
      <label for="nama_pasangan">NAMA PASANGAN  :</label>
      <input type="text" id="nama_pasangan" name="nama_pasangan" required>
      <label for="no_hp_pasangan">NOMOR HANDPHONE PASANGAN  :</label>
      <input type="tel" id="no_hp_pasangan" name="no_hp_pasangan" pattern="[0-9]{10,12}" required>
      <label for="jumlah_anak">JUMLAH ANAK  :</label>
      <input type="number" id="jumlah_anak" name="jumlah_anak" required>
      <label for="nama_orangtua">NAMA ORANGTUA  :</label>
      <input type="text" id="nama_orangtua" name="nama_orangtua" required>
      <label for="no_hp_orangtua">NOMOR HANDPHONE ORANGTUA  :</label>
      <input type="tel" id="no_hp_orangtua" name="no_hp_orangtua" pattern="[0-9]{10,12}" required>
      <label for="no_sim">NOMOR SIM  :</label>
      <input type="number" id="no_sim" name="no_sim" required>
      <label for="kelas_sim">KELAS SIM  :</label>
      <select type="pilihan" id="kelas_sim" name="kelas_sim" required>
      <option value="" disabled selected>--Pilih--</option>
      <option value="SIM A">SIM A</option>
      <option value="SIM A UMUM">SIM A UMUM</option>
      <option value="SIM B1">SIM B1</option>
      <option value="SIM B1 UMUM">SIM B1 UMUM</option>
      <option value="SIM B2">SIM B2</option>
      <option value="SIM B2 UMUM">SIM B2 UMUM</option>
      </select>
      <label for="masa_berlaku_sim">MASA BERLAKU SIM  :</label>
      <input type="date" id="masa_berlaku_sim" name="masa_berlaku_sim" required>
      <label for="pengalaman_mengemudi">PENGALAMAN MENGEMUDI  :</label>
      <input type="text" id="pengalaman_mengemudi" name="pengalaman_mengemudi" required>
      <label for="jenis_kendaraan">JENIS KENDARAAN DIKUASAI  :</label>
      <input type="text" id="jenis_kendaraan" name="jenis_kendaraan" required>
      <label for="sertifikat_mengemudi">SERTIFIKAT MENGEMUDI  :</label>
      <input type="text" id="sertifikat_mengemudi" name="sertifikat_mengemudi" required>
      <label for="pendidikan_terakhir">PENDIDIKAN TERAKHIR  :</label>
      <select type="pilihan" id="pendidikan_terakhir" name="pendidikan_terakhir" required>
      <option value="" disabled selected>--Pilih--</option>
      <option value="SARJANA">SARJANA</option>
      <option value="SMU/SMK/MA SEDERAJAT">SMU/SMK/MA SEDERAJAT</option>
      <option value="SMP/MTS SEDERAJAT">SMP/MTS SEDERAJAT</option>
      <option value="SD/MI SEDERAJAT">SD/MI SEDERAJAT</option>
      <option value="TIDAK SEKOLAH">TIDAK SEKOLAH</option>
      </select>
      <label for="nama_sekolah">NAMA SEKOLAH  :</label>
      <input type="text" id="nama_sekolah" name="nama_sekolah" required>
      <label for="tahun_lulus">TAHUN LULUS  :</label>
      <input type="number" id="tahun_lulus" name="tahun_lulus" required>
      <label for="nama_perusahaan_sebelumnya">NAMA PERUSAHAAN SEBELUMNYA  :</label>
      <input type="text" id="nama_perusahaan_sebelumnya" name="nama_perusahaan_sebelumnya" required>
      <label for="jabatan">JABATAN  :</label>
      <input type="text" id="jabatan" name="jabatan" required>
      <label for="periode_bekerja">PERIODE BEKERJA  :</label>
      <input type="text" id="periode_bekerja" name="periode_bekerja" required>
      <label for="alasan_berhenti">ALASAN BERHENTI  :</label>
      <input type="text" id="alasan_berhenti" name="alasan_berhenti" required>
      <label for="riwayat_penyakit_berat">RIWAYAT PENYAKIT BERAT  :</label>
      <input type="text" id="riwayat_penyakit_berat" name="riwayat_penyakit_berat" required>
      <label for="status_kesehatan">STATUS KESEHATAN SAAT INI  :</label>
      <select type="pilihan" id="status_kesehatan" name="status_kesehatan" required>
      <option value="" disabled selected>--Pilih--</option>
      <option value="SEHAT">SEHAT</option>
      <option value="SEDANG DALAM PENGOBATAN">SEDANG DALAM PENGOBATAN</option>
      </select>
      <label for="asuransi">KEPEMILIKAN ASURANSI KESEHATAN  :</label>
      <input type="text" id="asuransi" name="asuransi" required>
      <label for="no_asuransi">NOMOR ASURANSI  :</label>
      <input type="text" id="no_asuransi" name="no_asuransi" required>
      <input type="submit" value="SIMPAN DATA">
      <button type="edit" class="button-edit" onclick="editData()">EDIT</button>
      </button>


    </form>
  </div>
  
  <div id="footer">
    BRAGA HOLIDAY INDONESIA
  </div>

</body>
</html>


<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CARI DATA DRIVER</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    input { padding: 10px; width: 300px; }
    button { padding: 10px; cursor: pointer; }
    .hasil-box { margin-top: 20px; padding: 10px; border: 1px solid #ddd; background: #f9f9f9; }
  </style>
</head>
<body>
      
  <h2>Cari Data Driver</h2>
  <input type="text" id="keyword" placeholder="Masukkan kata kunci pencarian...">
  <button onclick="cariData()">Cari</button>

  <div id="hasil" class="hasil-box">Hasil pencarian akan muncul di sini...</div>

  <script>
    const URL_API = "https://script.google.com/macros/s/AKfycbxXy8bqJSZ5h8-A1A2X-hRlytNLvDSk9_Wx-t31dHSrsE-Rzn99n5IzMahp46BF3Po/exec"; // Ganti dengan URL Apps Script Anda!

    async function cariData() {
      const keyword = document.getElementById("keyword").value.toLowerCase();
      const hasilDiv = document.getElementById("hasil");
      hasilDiv.innerHTML = "Mencari data...";

      try {
        const response = await fetch(URL_API);
        const data = await response.json();

        // Cari data yang sesuai dengan kata kunci (di sini mencari berdasarkan kolom "Nama Barang")
        const hasilCari = data.filter(item => 
          item["id_driver"].toLowerCase().includes(keyword)
        );

        if (hasilCari.length > 0) {
          let output = "<ul>";
          hasilCari.forEach(item => {
            output += `<li><strong>${item["id_driver"]}</strong> - Nama : ${item["nama_lengkap"]}- TEMPAT/TANGGAL LAHIR : ${item["tempat_tgl_lahir"]}- JENIS KELAMIN : ${item["jenis_kelamin"]}- AGAMA : ${item["agama"]}- NO HANDPHONE 1 : ${item["no_hp_1"]}- NO HANDPHONE 2 : ${item["no_hp_2"]}- EMAIL: ${item["email"]}- ALAMAT LENGKAP : ${item["alamat_lengkap"]}- STATUS PERKAWINAN : ${item["status_perkawinan"]}- NAMA PASANGAN : ${item["nama_pasangan"]}- NO HANDPHONE PASANGAN : ${item["no_hp_pasangan"]}- JUMLAH ANAK : ${item["jumlah_anak"]}- NAMA ORANGTUA: ${item["nama_orangtua"]}- NO HANDPHONE ORANGTUA : ${item["no_hp_orangtua"]}- NOMOR SIM : ${item["no_sim"]}- KELAS SIM : ${item["kelas_sim"]}- MASA BERLAKU SIM : ${item["masa_berlaku_sim"]}- PENGALAMAN MENGEMUDI : ${item["pengalaman_mengemudi"]}- JENIS KENDARAAN DIKUASAI : ${item["jenis_kendaraan"]}- SERTIFIKAT MENGEMUDI : ${item["sertifikat_mengemudi"]}- PENDIDIKAN TERAKHIR : ${item["pendidikan_terakhir"]}- NAMA SEKOLAH : ${item["nama_sekolah"]}- TAHUN LULUS : ${item["tahun_lulus"]}- NAMA PERUSAHAAN SEBELUMNYA : ${item["nama_perusahaan_sebelumnya"]}- JABATAN : ${item["jabatan"]}- PERIODE BEKERJA : ${item["periode_bekerja"]}- ALASAN BERHENTI : ${item["alasan_berhenti"]}- RIWAYAT PENYAKIT BERAT : ${item["riwayat_penyakit_berat"]}- STATUS KESEHATAN SAAT INI : ${item["status_kesehatan"]}- KEPIMILIKAN ASURANSI KESEHATAN : ${item["asuransi"]}- NOMOR ASURANSI : ${item["no_asuransi"]}</li>`;
          });
          output += "</ul>";
          hasilDiv.innerHTML = output;
        } else {
          hasilDiv.innerHTML = "Data tidak ditemukan.";
        }
      } catch (error) {
        hasilDiv.innerHTML = "Terjadi kesalahan saat mengambil data.";
        console.error(error);
      }
    }
  </script>
  </body>

</html>
